<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pivity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFEB; --board:#DCE0DA; --cell:#E5E8E2; --line:#CDD2CB; --ink:#202A2E; --sub:#5F6B6C;
  --wall:#1E2426; --wall-hi:#2E3538; --panel:#F6F7F4;
  --up:#FFB0A2; --right:#A8E6D3; --down:#B8CCFF; --left:#E8C6F2; --goal:#D9A93A; --cube:#5D6873;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
  --tick:110ms;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C2127; --board:#262C34; --cell:#2C333C; --line:#39414C; --ink:#ECE8E1; --sub:#9AA2A8;
    --wall:#0A0C0F; --wall-hi:#16191E; --panel:#2A3039;
    --up:#D0604F; --right:#2F8F7A; --down:#4E6FC0; --left:#9160A8; --goal:#EFCB7B; --cube:#F4F1EB;
  }
}
:root[data-theme="dark"]{
  --bg:#1C2127; --board:#262C34; --cell:#2C333C; --line:#39414C; --ink:#ECE8E1; --sub:#9AA2A8;
  --wall:#0A0C0F; --wall-hi:#16191E; --panel:#2A3039;
  --up:#D0604F; --right:#2F8F7A; --down:#4E6FC0; --left:#9160A8; --goal:#EFCB7B; --cube:#F4F1EB;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--goal);outline-offset:2px}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:16px 14px 24px}
.screen[hidden]{display:none}

/* ---------- buttons ---------- */
.btn{border:0;cursor:pointer;border-radius:12px;padding:12px 20px;font-weight:700;font-size:16px;
  background:var(--panel);color:var(--ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.small{padding:8px 14px;font-size:14px;border-radius:10px}
.iconbtn{border:0;background:none;cursor:pointer;padding:8px;border-radius:10px;font-size:15px;font-weight:700;color:var(--sub)}

/* ---------- title ---------- */
#title{justify-content:center;gap:28px;overflow:hidden;position:relative}
.logo-wrap{position:relative;width:min(92vw,760px);aspect-ratio:10/4;display:grid;place-items:center}
.logo{font-family:var(--display);font-weight:400;font-size:min(13vw,120px);line-height:1.1;letter-spacing:.01em;margin:0;display:flex;white-space:nowrap}
.logo span{display:inline-block}
.logo{color:var(--ink)}
.logo.hide{visibility:hidden}
.cover{position:absolute;inset:0;pointer-events:none;z-index:5}
.cover .icube{position:absolute;width:10%;height:25%}
.title-ui{display:flex;flex-direction:column;align-items:center;gap:22px;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
#title.revealed .title-ui{opacity:1;transform:none}
.tagline{margin:0;color:var(--sub);font-size:17px;letter-spacing:.08em}
.title-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.title-actions .btn{min-width:170px}
.skip{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--sub);opacity:.8}
#title.revealed .skip{display:none}

/* ---------- cube (shared) ---------- */
.face{position:absolute;inset:7%;border-radius:24%;display:grid;place-items:center;background:var(--cube);
  box-shadow:inset 0 -.2em 0 rgba(0,0,0,.14), 0 .12em .3em rgba(0,0,0,.18);
  transition:transform calc(var(--tick) * 3) cubic-bezier(.3,1.4,.5,1), color .3s}
.face svg{width:58%;height:58%;display:block}
[data-d="0"]>.pop>.face,[data-d="0"]>.face{color:var(--up)}
[data-d="1"]>.pop>.face,[data-d="1"]>.face{color:var(--right)}
[data-d="2"]>.pop>.face,[data-d="2"]>.face{color:var(--down)}
[data-d="3"]>.pop>.face,[data-d="3"]>.face{color:var(--left)}

/* ---------- select ---------- */
.topbar{width:min(100%,600px);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.topbar h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;flex:1;text-align:center}
.topbar .spacer{width:120px}
.sound{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:12px;display:flex;gap:4px;z-index:40}
.sndbtn{display:flex;align-items:center;gap:4px;border:0;background:var(--panel);color:var(--sub);cursor:pointer;border-radius:10px;padding:6px 8px;font-size:11px;font-weight:700}
.sndbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sndbtn .x{display:none}
.sndbtn[aria-pressed="false"]{opacity:.55}
.sndbtn[aria-pressed="false"] .x{display:inline}
.sndbtn[aria-pressed="false"] .w{display:none}
.rules{width:min(100%,600px);margin:10px 0 18px;padding:14px 16px;border-radius:14px;background:var(--panel);font-size:14px;line-height:1.75;color:var(--sub)}
.rules p{margin:0}
.stages{width:min(100%,600px)}
.tally{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--sub);margin:0 0 4px;align-self:center}
.tally .of{margin-left:4px;font-weight:500}
.tally span{margin-right:8px}
.group{display:flex;align-items:center;gap:6px;margin:22px 2px 10px;font-family:var(--display);font-weight:400;font-size:18px}
.group span:not(.sw){margin-left:4px}
.group small{margin-left:auto;font-family:var(--body);font-size:13px;color:var(--sub);font-weight:700}
.sw{width:16px;height:16px;border-radius:4px;border:2px dashed var(--goal);
  background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--goal) 55%,transparent) 0 2px,transparent 2px 5px)}
.stagegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:9px}
.stage{position:relative;aspect-ratio:1;border:0;cursor:pointer;border-radius:14px;background:var(--board);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px}
.stage .num{font-family:var(--display);font-size:clamp(20px,6vw,30px);line-height:1}
.stage .nm{font-size:10.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stage .tile-star{position:absolute;top:2px;right:2px;width:24px;height:24px}
.testtile{width:100%;margin-top:24px;aspect-ratio:auto;gap:6px;padding:18px;border:3px dashed var(--goal);
  background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--goal) 22%,transparent) 0 6px,transparent 6px 14px),var(--board)}
.testtile .num{font-size:22px;white-space:nowrap}
.testtile .nm{font-size:13px}

/* ---------- stars ---------- */
.star .s-body{fill:var(--ink);stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}
.star.shine{overflow:visible;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--goal) 80%,transparent))}
.star.shine .s-body{fill:var(--goal);stroke:color-mix(in srgb,var(--goal) 50%,#fff);stroke-width:1.1}
.star.shine .s-glint{stroke:#fff;stroke-width:1.6;stroke-linecap:round;opacity:.9}
.star.shine .rays line{stroke:var(--goal);stroke-width:1.8;stroke-linecap:round}
.star.shine .rays{transform-origin:12px 12px;animation:twinkle 1.8s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.05)}}
.star.mini{width:18px;height:18px}
.star.big{width:84px;height:84px;display:block;margin:0 auto 6px}

/* ---------- game ---------- */
.hud{width:min(100%,560px);display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 10px;gap:10px}
.hud .stname{font-family:var(--display);font-size:20px}
.hud .count{font-size:15px;color:var(--sub);white-space:nowrap}
.hud .count b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--ink);margin-right:2px}
.board{position:relative;width:min(94vw,58vh,560px);aspect-ratio:1;background:var(--board);border-radius:14px;
  padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:0 0 0 6px var(--board)}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr)}
.cells i{border-radius:12%;margin:3%;background:var(--cell)}
.layer{position:absolute;inset:0}
.piece{position:absolute;left:0;top:0;width:calc(100% / 9);height:calc(100% / 9)}
.cube{border:0;padding:0;background:none;cursor:pointer;font-size:clamp(9px,2.6vw,15px);transition:transform var(--tick) linear;z-index:3}
.cube .pop{position:absolute;inset:0}
.cube .pop.bump{animation:bump .33s ease}
@keyframes bump{30%{transform:scale(.8)}70%{transform:scale(1.08)}}
.cube.win .pop{animation:winpulse .9s ease infinite}
@keyframes winpulse{50%{transform:scale(1.12)}}
.wall{z-index:1}
.wall::before{content:"";position:absolute;inset:3%;border-radius:14%;background:var(--wall);
  box-shadow:inset 0 3px 0 var(--wall-hi)}
.goal{z-index:0}
.goal::before{content:"";position:absolute;inset:5%;border-radius:12%;border:3px dashed var(--goal);
  background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--goal) 55%,transparent) 0 3px,transparent 3px 8px)}
.goal.filled::before{border-style:solid}
.goal.lit::before{background:var(--goal);box-shadow:0 0 22px var(--goal)}
.board.playing{touch-action:none}
.cube.dragging{z-index:20}
.board.busy .cube{cursor:default}
.guide{position:absolute;inset:-100%;pointer-events:none;display:none}
.cube.dragging .guide{display:block}
.guide .g{position:absolute;width:33.34%;height:33.34%;display:grid;place-items:center;opacity:.35;transition:opacity .1s,transform .1s}
.guide .g svg{width:55%;height:55%;padding:8%;border-radius:30%;background:var(--ink);box-sizing:content-box}
.guide .g svg path{fill:var(--bg)}
.guide .g0{left:33.33%;top:0}.guide .g1{left:66.66%;top:33.33%;transform:rotate(90deg)}
.guide .g2{left:33.33%;top:66.66%;transform:rotate(180deg)}.guide .g3{left:0;top:33.33%;transform:rotate(270deg)}
.guide[data-cur="0"] .g0,.guide[data-cur="1"] .g1,.guide[data-cur="2"] .g2,.guide[data-cur="3"] .g3{opacity:.15}
.guide[data-sel="0"] .g0,.guide[data-sel="1"] .g1,.guide[data-sel="2"] .g2,.guide[data-sel="3"] .g3{opacity:1}
.guide[data-sel] .g svg{background:var(--cube)}
.guide[data-sel="0"] .g0 svg path{fill:var(--up)}.guide[data-sel="1"] .g1 svg path{fill:var(--right)}
.guide[data-sel="2"] .g2 svg path{fill:var(--down)}.guide[data-sel="3"] .g3 svg path{fill:var(--left)}
.hint{width:min(100%,560px);min-height:1.6em;margin:16px 0 8px;font-size:15px;color:var(--sub);text-align:center;line-height:1.6}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- test room ---------- */
.mode[hidden]{display:none}
.mode{display:inline-flex;background:var(--panel);border-radius:12px;padding:4px;gap:4px}
.mode button{border:0;background:none;cursor:pointer;padding:7px 16px;border-radius:9px;font-weight:700;color:var(--sub)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.palette{display:flex;gap:6px;margin:16px 0 6px;flex-wrap:wrap;justify-content:center}
.tool{position:relative;width:48px;height:48px;border:0;border-radius:12px;background:var(--panel);cursor:pointer;padding:0;font-size:12px}
.tool[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.tool .face{inset:12%;font-size:10px}
.tool.t-wall::after{content:"";position:absolute;inset:12%;border-radius:14%;background:var(--wall);box-shadow:inset 0 3px 0 var(--wall-hi)}
.tool.t-goal::after{content:"";position:absolute;inset:12%;border-radius:12%;border:3px dashed var(--goal);
  background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--goal) 55%,transparent) 0 3px,transparent 3px 8px)}
.tool.t-erase{font-weight:700;color:var(--sub)}
.tool-label{font-size:13px;color:var(--sub);margin:0 0 10px;min-height:1.4em}
.codebox{width:min(100%,560px);margin-top:14px;font-size:14px}
.codebox summary{cursor:pointer;color:var(--sub);font-weight:700;padding:6px 0}
.codebox textarea{width:100%;height:84px;margin:8px 0;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink);
  font:13px/1.4 ui-monospace,Menlo,monospace;padding:8px;resize:vertical}
#editUI{display:flex;flex-direction:column;align-items:center;width:100%}
#editUI[hidden],#playUI[hidden]{display:none}
.board.editing{cursor:crosshair}
.board.editing .cube{cursor:crosshair;pointer-events:none}

/* ---------- overlay ---------- */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);z-index:50;padding:20px}
.overlay[hidden]{display:none}
.card{background:var(--panel);border-radius:20px;padding:26px 24px 22px;width:min(92vw,360px);text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.25);
  animation:cardin .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes cardin{from{transform:scale(.85);opacity:0}}
.card h3{font-family:var(--display);font-weight:400;font-size:30px;margin:0 0 8px}
.card p{margin:0 0 20px;color:var(--sub);line-height:1.6}
.card .actions{flex-direction:column}
.card .btn{width:100%}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:12px 20px;border-radius:12px;font-weight:700;z-index:60;width:max-content;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast[hidden]{display:none}

@media (max-width:420px){
  .stages{gap:8px}
  .tool{width:42px;height:42px}
}
@media (prefers-reduced-motion:reduce){
  .cube{transition:none}
  .face{transition:none}
  .cube .pop.bump,.cube.win .pop,.card,.star.shine .rays{animation:none}
}
</style>
</head>
<body>
<div class="sound" role="group" aria-label="サウンド">
  <button class="sndbtn" id="sndBgm" aria-label="BGM" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/><line class="x" x1="3" y1="3" x2="21" y2="21"/></svg><span>BGM</span></button>
  <button class="sndbtn" id="sndSe" aria-label="効果音" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h4l5-4v13l-5-4H4z"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><line class="x" x1="3" y1="3" x2="21" y2="21"/></svg><span>SE</span></button>
</div>
<section class="screen" id="title">
  <div class="logo-wrap">
    <h1 class="logo hide" id="logo" aria-label="Pivity"><span>P</span><span>I</span><span>V</span><span>I</span><span>T</span><span>Y</span></h1>
    <div class="cover" id="cover" aria-hidden="true"></div>
  </div>
  <div class="title-ui">
    <p class="tagline">回して、落として、ゴールへ。</p>
    <div class="title-actions">
      <button class="btn primary" id="toSelect">ステージを選ぶ</button>
      <button class="btn" id="toTestFromTitle">テストルーム</button>
    </div>
  </div>
  <div class="skip">タップでスキップ</div>
</section>

<section class="screen" id="select" hidden>
  <div class="topbar">
    <button class="iconbtn" id="selBack">← タイトル</button>
    <h2>ステージ</h2>
    <span class="spacer"></span>
  </div>
  <div class="rules">
    <p>キューブは矢印の方向へ、ぶつかるまで進みます。キューブをフリック（PCはドラッグ）すると、その方向へ向きが変わります。2つのキューブが同じマスを狙うと、手前で止まって時計回りに1回転。黄色いゴールすべてにキューブを止めればクリアです。</p>
  </div>
  <div class="tally" id="tally"></div>
  <div class="stages" id="stages"></div>
</section>

<section class="screen" id="game" hidden>
  <div class="topbar">
    <button class="iconbtn" id="gameBack">← ステージ</button>
    <div class="mode" id="modeSwitch" hidden>
      <button id="modeEdit" aria-pressed="true">Edit</button>
      <button id="modePlay" aria-pressed="false">Play</button>
    </div>
    <span class="spacer"></span>
  </div>
  <div class="hud">
    <span class="stname" id="stName"></span>
    <span class="count" id="count"></span>
  </div>
  <div class="board" id="board">
    <div class="cells" id="cells"></div>
    <div class="layer" id="layer"></div>
  </div>

  <div id="playUI">
    <p class="hint" id="hint"></p>
    <div class="actions"><button class="btn small" id="restart">やり直す</button></div>
  </div>

  <div id="editUI" hidden>
    <div class="palette" id="palette"></div>
    <p class="tool-label" id="toolLabel"></p>
    <div class="actions">
      <button class="btn small" id="clearAll">すべて消す</button>
      <button class="btn small primary" id="playBtn">Playで試す</button>
    </div>
    <details class="codebox">
      <summary>ステージコード</summary>
      <textarea id="codeText" spellcheck="false" aria-label="ステージコード"></textarea>
      <div class="actions">
        <button class="btn small" id="copyCode">コピー</button>
        <button class="btn small" id="loadCode">このコードを読み込む</button>
      </div>
    </details>
  </div>
</section>

<div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
    <div id="ovIcon"></div>
    <h3 id="ovTitle">クリア</h3>
    <p id="ovText"></p>
    <div class="actions" id="ovActions"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
// ===== Pivity engine (shared) =====
const N = 9;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0]; // 0↑ 1→ 2↓ 3←
const ROT_TICKS = 3;
const GOAL_HOLD = 12;
function makeState(lv) {
  return {
    cubes: lv.cubes.map((c, i) => ({ id: i, x: c[0], y: c[1], d: c[2], nd: c[2], rot: 0, hold: 0 })),
    walls: new Set(lv.walls.map(w => w[1] * N + w[0])),
    goals: (lv.goals || []).map(g => g.slice()),
    tick: 0
  };
}
function stepState(s) {
  const ev = { moved: [], collided: [], rotDone: [] };
  for (const c of s.cubes) {
    if (c.rot > 0 && --c.rot === 0) { c.d = c.nd; ev.rotDone.push(c); }
  }
  const occ = new Set();
  for (const c of s.cubes) occ.add(c.y * N + c.x);
  const want = new Map();
  for (const c of s.cubes) {
    if (c.rot > 0) continue;
    const nx = c.x + DX[c.d], ny = c.y + DY[c.d];
    if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
    const k = ny * N + nx;
    if (s.walls.has(k) || occ.has(k)) continue;
    if (!want.has(k)) want.set(k, []);
    want.get(k).push(c);
  }
  const movedSet = new Set();
  for (const [k, arr] of want) {
    if (arr.length === 1) { const c = arr[0]; c.x = k % N; c.y = (k / N) | 0; ev.moved.push(c); movedSet.add(c); }
    else if (!s.noRot) for (const c of arr) { c.rot = ROT_TICKS; c.nd = (c.d + 1) % 4; ev.collided.push(c); }
  }
  s.tick++;
  const stable = ev.moved.length === 0 && ev.collided.length === 0 && s.cubes.every(c => c.rot === 0);
  for (const c of s.cubes) {
    if (c.rot === 0 && !movedSet.has(c)) c.hold++; else c.hold = 0;
  }
  let win = s.goals.length > 0;
  for (const g of s.goals) {
    const c = s.cubes.find(c => c.x === g[0] && c.y === g[1]);
    if (!c || !(stable || c.hold >= GOAL_HOLD)) { win = false; break; }
  }
  ev.stable = stable; ev.win = win;
  return ev;
}
// flick: set cube's next direction. returns true if it counts as a move
function flickCube(c, d) {

/* stage code: 81 chars, row by row.  . empty  # wall  G goal  ^ > v < cubes */
function encodeCode(lv) {
  const g = Array(81).fill('.');
  for (const [x, y] of lv.walls) g[y * 9 + x] = '#';
  for (const [x, y] of lv.goals) g[y * 9 + x] = 'G';
  for (const [x, y, d] of lv.cubes) g[y * 9 + x] = '^>v<'[d];
  let s = 'PIVITY:'; for (let r = 0; r < 9; r++) s += g.slice(r * 9, r * 9 + 9).join('') + (r < 8 ? '/' : '');
  return s;
}
function decodeCode(str) {
  const body = str.trim().replace(/^PIVITY:/i, '').replace(/[\/\s]/g, '');
  if (body.length !== 81 || /[^.#G^>v<]/.test(body)) return null;
  const lv = { cubes: [], walls: [], goals: [] };
  for (let i = 0; i < 81; i++) {
    const ch = body[i], x = i % 9, y = (i / 9) | 0;
    if (ch === '#') lv.walls.push([x, y]);
    else if (ch === 'G') lv.goals.push([x, y]);
    else if (ch !== '.') lv.cubes.push([x, y, '^>v<'.indexOf(ch)]);
  }
  return lv.goals.length > MAX_GOALS ? null : lv;
}
$('#copyCode').onclick = async () => {
  const t = $('#codeText');
  try { await navigator.clipboard.writeText(t.value); toast('コードをコピーしました'); }
  catch (e) { t.select(); toast('選択しました。手動でコピーしてください'); }
};
$('#loadCode').onclick = () => {
  const lv = decodeCode($('#codeText').value);
  if (!lv) return toast(`コードの形式が違います（81マス分・ゴールは${MAX_GOALS}つまで）`);
  edit = lv; save('pivity.testroom.v2', edit); renderEdit(); toast('読み込みました');
};

const Snd = (() => {

    delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(wet); wet.connect(bgmBus);

    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (st.bgm) startBGM();

    g.gain.setValueAtTime(o.vol || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  const now = () => ctx ? ctx.currentTime + 0.005 : 0;
  function bell(f, t, dur, vol) { tone(f, t, dur, { vol }); tone(f * 2.005, t, dur * 0.5, { vol: vol * 0.3 }); }

  const FLICK = [81, 78, 74, 76]; // ↑A5 →F#5 ↓D5 ←E5

    ui() { const t = now(); tone(1320, t, 0.05, { vol: 0.06 }); },

    { b: 45, c: [57, 61, 64, 66] },  // A6
    { b: 42, c: [54, 57, 61, 64] },  // F#m7
    { b: 47, c: [54, 57, 59, 62] },  // Bm7
    { b: 40, c: [52, 55, 59, 62] },  // Em7
    { b: 45, c: [57, 62, 64, 67], c2: [57, 61, 64, 67] }, // A7sus4 -> A7
    { b: 38, c: [57, 61, 62, 66] },  // Dmaj7

})();

  if (e.target.closest('.btn, .stage, .iconbtn, .tool, .mode button, summary')) Snd.se.ui();
}, true);
document.addEventListener('keydown', () => Snd.init(), true);

/* ---------- logo fit ---------- */
function fitLogo() {
  const w = document.querySelector('.logo-wrap'), l = $('#logo');
  if (!w || !w.clientWidth) return;
  l.style.fontSize = '100px';
  const s = Math.min(w.clientWidth * 0.9 / l.scrollWidth, w.clientHeight * 0.8 / l.offsetHeight);
  l.style.fontSize = (100 * s).toFixed(1) + 'px';
}
fitLogo();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLogo);
addEventListener('resize', fitLogo);

/* ---------- boot ---------- */
renderSelect();
playIntro();

</script>
